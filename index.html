<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timinal</title>
<style>
:root { --bg:#FAF9F5; --fg:#2C2C2A; --muted:#6B6A64; --line:#E2E0D8; --accent:#D85A30; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ECEBE6; --muted:#A3A19A; --line:#33322F; --accent:#EF9F27; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
main { max-width:760px; margin:0 auto; padding:48px 20px 80px; }
nav { display:flex; gap:16px; font-size:14px; margin-bottom:32px; }
a { color:var(--accent); }
h1 { font-size:28px; margin:8px 0 4px; } h2 { font-size:19px; margin:36px 0 8px; }
p, li { color:var(--fg); } li.sub { margin-left:20px; list-style:circle; }
hr { border:0; border-top:1px solid var(--line); margin:56px 0; }
.table { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.dots { letter-spacing:6px; color:var(--accent); }
</style>
</head>
<body><main>
<p class="dots">● ● ● ● ●</p><h1>Timinal</h1><p>시간이 떨어지는 걸 지켜보는 미니멀 타이머.<br>A minimal timer where time drips away.</p><p><a href="privacy/">개인정보 처리방침 · Privacy Policy</a></p>
</main></body>
</html>
